[package]
name = "pi-vcs-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Thin pi-vcs CLI front: git-compatible rev-diff / staged-diff / repo-info / watch over gitoxide, for the DeepSeek Harness ctx.vcs host service"

# Narrow slice only: no jj backend (the harness fork is git-only), no
# mutation verbs. The diff renderer is a faithful port of oh-my-pi's
# crates/pi-vcs git backend (MIT).
[dependencies]
gix = { version = "0.85", default-features = false, features = [
  "attributes",
  "blob-diff",
  "dirwalk",
  "excludes",
  "index",
  "max-performance-safe",
  "merge",
  "revision",
  "sha1",
  "sha256",
  "status",
  "tree-editor",
  "zlib-rs",
] }
serde_json = "1"
thiserror = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
