# Opt-in Agent Graph patch over the shipped Web composition: mounts the graph
# host assembly so one root session can supervise operator children through
# the `view_agent_graph` / `update_agent_graph` / `yield_agent_graph` tools
# (Maka port, slices P6-P7a).
#
# Plane split (load-bearing — do not move rows between planes):
# - `graph-host` is a HOST row: it injects host services (`agents`, `sessions`,
#   `subagents`, `git`, `compaction`) and publishes `agentGraphController` +
#   `graphHostServices`. A preset row publishing a service collides across
#   sessions; the same rule keeps the `subagents` registry host-side.
# - The model-facing rows below the line belong to the graph root session's
#   AGENT PRESET, not to this host patch (they publish nothing):
#
#       # graph root session's agent preset (agent.cordis.yml)
#       - id: tool-graph
#         name: '@deepseek-ai/dsh-tool-graph'
#       - id: graph-projection
#         name: '@deepseek-ai/dsh-graph-projection'
#
# Requirements:
# - `rootSessionId` MUST be the deployment's graph root session id: the agent
#   that is the parent of every operator child and the owner of the
#   `graph/change` events. The assembly builds when that agent publishes; a
#   wrong id mounts silently and no graph is ever built, so the placeholder
#   below is not a valid value.
# - `subagentProvider` must name a provider the composition registers. The
#   shipped base bundle already mounts `@deepseek-ai/dsh-subagent-spawn-in-process`
#   with `providerName: spawn`, so `spawn` resolves without another row.
# - `backend` defaults to `sqlite`, whose kv facet hosts the graph control
#   unit. The dsh-web-app bundle already mounts `storage-sqlite` (for memory
#   extraction), so this patch overrides that row's `path` instead of inserting
#   it again — a second insert would fail as a duplicate loader entry id. All
#   sqlite units share the one medium, each in its own tables.
# - `graph-host` injects the host-plane `compaction` service, which the shipped
#   Web composition disables (`compaction-basic` moved behind agent presets).
#   This patch re-enables that host row: presets keep their isolated per-agent
#   engines, so the host row serves only host-plane consumers like graph-host.

# The Web composition disables the base compaction row; re-enable it for the
# graph-host injection below.
- id: compaction-basic
  disabled: false

# Override the web-app bundle's storage-sqlite row path (the graph control
# unit is durable deployment data, not the memory-extraction file).
- id: storage-sqlite
  name: '@deepseek-ai/dsh-storage-sqlite'
  config:
    # Override with DSH_GRAPH_DB; ':memory:' loses every graph control row
    # on restart, so it is not the durable choice.
    path: !!js process.env.DSH_GRAPH_DB ?? '.dsh/graph.sqlite'

- insert:
    - id: graph-host
      name: '@deepseek-ai/dsh-graph-host'
      config:
        rootSessionId: <ROOT_SESSION_ID>  # TODO: replace with the deployment's graph root session id
        subagentProvider: spawn           # provider registered by @deepseek-ai/dsh-subagent-spawn-in-process
        backend: sqlite                   # storage backend hosting the graph control unit (default sqlite)
        maxNewActivations: 4              # new operator activations per reconcile drive (default 4)
